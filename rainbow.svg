<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <style>
    .rainbow-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: url(#rainbow-gradient);
    }
  </style>

  <defs>
    <linearGradient id="rainbow-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000">
        <animate attributeName="stop-color" values="#ff0000; #ff7f00; #ffff00; #00ff00; #0000ff; #4b0082; #8b00ff; #ff0000" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#00ff00">
        <animate attributeName="stop-color" values="#00ff00; #0000ff; #4b0082; #8b00ff; #ff0000; #ff7f00; #ffff00; #00ff00" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b00ff">
        <animate attributeName="stop-color" values="#8b00ff; #ff0000; #ff7f00; #ffff00; #00ff00; #0000ff; #4b0082; #8b00ff" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- Content -->
  <text x="50%" y="50%" class="rainbow-text">Your Text Here</text>
</svg>
