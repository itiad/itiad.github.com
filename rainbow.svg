<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <style>
    .rainbow-text {
      font-family: Arial Black, Gadget, sans-serif;
      font-size: 42px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: url(#rainbow-gradient);
    }
  </style>

  <defs>
    <linearGradient id="rainbow-gradient" x1="-150%" y1="0%" x2="0%" y2="0%">
      <!-- Balanced multi-color stops (evenly distributed spectrum) -->
      <stop offset="0%" stop-color="#ff0080" />
      <stop offset="16.6%" stop-color="#8000ff" />
      <stop offset="33.3%" stop-color="#0080ff" />
      <stop offset="50%" stop-color="#00ff80" />
      <stop offset="66.6%" stop-color="#ffff00" />
      <stop offset="83.3%" stop-color="#ff8000" />
      <stop offset="100%" stop-color="#ff0080" />
      
      <!-- Slide left-to-right and back right-to-left -->
      <animate attributeName="x1" values="-150%; 0%; -150%" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%; 150%; 0%" dur="6s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <!-- Content -->
  <text x="50%" y="50%" class="rainbow-text">Welcome To My Island</text>
</svg>
