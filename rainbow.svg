.rainbow-text {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
font-size: 42px;
     font-weight: 900;text-align: center;/* Rainbow Gradient Background /
background: linear-gradient(95deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
background-size: 400% 400%;
/ Clip Background to Text /
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
/ Animation */animation: rainbow-animation 8s ease infinite;padding: 10px;}   @keyframes rainbow-animation {0% { background-position: 0% 50%; }50% { background-position: 100% 50%; }100% { background-position: 0% 50%; }}Animated Colorful Rainbow Gradient
