<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <style>
    .rainbow-text {
      font-family: Arial Black, Gadget, sans-serif;
      font-size: 42px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: middle;
      fill: url(#rainbow-gradient);
    }
  </style>

  <defs>
    <linearGradient id="rainbow-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000">
        <animate attributeName="stop-color" values="#ff0000; #00f; #ff0000" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="25%" stop-color="#ff8000">
        <animate attributeName="stop-color" values="#ff8000; #8000ff; #ff8000" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#ffff00">
        <animate attributeName="stop-color" values="#ffff00; #f0f; #ffff00" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="75%" stop-color="#00ff80">
        <animate attributeName="stop-color" values="#00ff80; #ff0080; #00ff80" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00ffff">
        <animate attributeName="stop-color" values="#00ffff; #ff00d4; #00ffff" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <!-- Content -->
  <text x="50%" y="50%" class="rainbow-text">Welcome To My Island</text>
</svg>
