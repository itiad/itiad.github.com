<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <style>
    .rainbow-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: middle;
      /* Rainbow Gradient Background */
      fill: url(#rainbow-gradient);
    }
    
    .rainbow-bg {
      background: linear-gradient(95deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
      background-size: 400% 400%;
      animation: rainbow-animation 8s ease infinite;
    }

    @keyframes rainbow-animation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>

  <defs>
    <linearGradient id="rainbow-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000" />
      <stop offset="16.6%" stop-color="#ff7f00" />
      <stop offset="33.3%" stop-color="#ffff00" />
      <stop offset="50%" stop-color="#00ff00" />
      <stop offset="66.6%" stop-color="#0000ff" />
      <stop offset="83.3%" stop-color="#4b0082" />
      <stop offset="100%" stop-color="#8b00ff" />
    </linearGradient>
  </defs>

  <!-- Content -->
  <text x="50%" y="50%" class="rainbow-text">Your Text Here</text>
</svg>
